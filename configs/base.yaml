run_name: v1
seed: 42
n_jobs: 64
paths:
  data_dir: data/student_resource/dataset
  validator: data/student_resource/utils/validate_submission.py
  artifacts: artifacts
split:
  a_train: 0.35
  a_val: 0.05
  n_folds: 5
blocking:
  tfidf:
    ngram_range: [3, 5]
    min_df: 2
    max_df: 0.05   # drop n-grams in >5% of docs: -0.06pt recall, ~2.5x faster (scripts/bench_tfidf_recall.py)
    top_k: 50
    min_sim: 0.1
    n_threads: 110
  state_groups:
    enabled: true
    min_share: 0.002   # merge states whose cross-state true pairs are >=0.2% of the larger state's pairs
    min_pairs: 100     # ...and at least this many pairs (stops tiny states chaining groups together)
  name_only:          # extra search for S2/S3 records with an EMPTY address (names only)
    enabled: true
    top_k: 20
    min_sim: 0.3
    min_df: 2
    max_df: 0.05
    min_token_len: 3
    max_block_size: 100
  keys:
    n_name_tokens: 2
    n_addr_tokens: 3
    min_token_len: 3
    max_block_size: 100
    n_jobs: 16          # parallel state-group processes for key blocks
gpu:
  mem_fraction: 0.4
bakeoff:
  models: [gte, nomic, arctic, bgem3, qwen8b]
  eval_distractors_per_country: 1000000
  ks: [10, 50, 100]
  encode_batch_size: 512
train:
  n_entities: 300000
  n_rounds: 3
  p_intra: 0.3
  cross_script_extra_rounds: 1   # extra triplets: English S1 -> Indian-script match
  aug_prob: 0.5
  batch_size: 256
  cached_mini_batch_size: 32
  max_steps: 3000
  learning_rate: 2.0e-5
  lora_learning_rate: 1.0e-4
  warmup_ratio: 0.1
